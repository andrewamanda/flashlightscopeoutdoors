<!-- Bootstrap CSS -->
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>

<style>
  #domainChangeModal .btn-subscribe {
    float: right; /* Floats the button to the right. */
}
</style>


<!-- Modal -->
<div class="modal fade" id="domainChangeModal" tabindex="-1" role="dialog" aria-labelledby="domainChangeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content" style="margin-top: 30%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); background: linear-gradient(to bottom, #f9f9f9, #e9e9e9); padding: 5px;">

            <!-- Close button -->
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="position:absolute; right: 10px; top: 10px; z-index: 2;">
                <span aria-hidden="true">&times;</span>
            </button>

            <div class="row no-gutters">
                <!-- Left pane -->
                <div class="col-md-6 pr-2" style="border-right: 1px solid #ccc;">
                    <!-- Company logo -->
                    <img src="https://tarheelreclaimed.com/static//heartwoodbeyond/default/files/rusticoak.png" alt="Company Logo" class="img-fluid mb-2">
                    <!-- Message -->
                    <p>Renowned for 38 years as <b><em>Heartwood Pine Floors</em></b>, we've evolved to <b><em>Tarheel Reclaimed</em></b>. While our name has changed, our dedicated team and commitment to service remain the same.</p>
                    <p>Stay updated with our latest news and offers. Subscribe to our email list:</p>
                    <input type="email" class="form-control" placeholder="Enter your email" id="subscriptionEmail">
                    <button type="button" class="btn btn-primary mt-2 btn-subscribe" id="subscribeButton">Subscribe</button>
                </div>
                <!-- Right pane -->
                <div class="col-md-6 d-flex align-items-center justify-content-center">
                    <!-- Product Image -->
                    <img src="https://www.tarheelreclaimed.com/static/heartwoodbeyond/gallery/floor_wholeroom_small.jpeg" alt="Product Image" class="img-fluid">
                </div>
            </div>

            <!-- Inside your modal, add a progress bar for the countdown -->
            <div class="modal-footer">
                <div class="progress" style="width: 100%; height: 20px;">
                    <div id="countdownProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

        </div>
    </div>
</div>











<script>
$(document).ready(function(){
    var shouldAutoHide = true; // Flag to control auto-hide

    setTimeout(function() {
        $('#domainChangeModal').modal('show');

        var countdown = 3; // Countdown start value in seconds
        var totalDuration = countdown; // Store total duration for progress calculation
        var updateProgress = function(value) {
            var progressPercentage = (value / totalDuration) * 100;
            $('#countdownProgressBar').css('width', progressPercentage + '%').attr('aria-valuenow', progressPercentage);
        };

        updateProgress(countdown); // Initialize progress bar

        var countdownInterval = setInterval(function() {
            countdown--;
            updateProgress(countdown); // Update progress bar

            if(countdown <= 0) {
                clearInterval(countdownInterval); // Stop the countdown
                if(shouldAutoHide) {
                    $('#domainChangeModal').modal('hide');
                }
            }
        }, 1000); // Update every second

    }, 2000); // Show modal after 2 seconds

    $('#subscriptionEmail').on('input', function() {
        shouldAutoHide = false; // Cancel auto-hide when user is typing
        // Optionally clear or update the countdown display
        $('#countdownProgressBar').removeClass('progress-bar-striped progress-bar-animated').addClass('bg-warning');
    });

    // Handle the subscribe button click
    $('#subscribeButton').click(function() {
        var email = $('#subscriptionEmail').val();

        $.ajaxSetup({
            type: 'POST',
            timeout: 30000,
            beforeSend: function(xhr, settings) {
                if (!this.crossDomain) {
                    xhr.setRequestHeader("X-CSRFToken", $.cookie('csrftoken'));
                }
            },
            error: function(xhr) {
                alert('Internet Connection Error: ' + xhr.status + ' ' + xhr.statusText);
            }
        });

        jQuery.post("/misc/email_frompopup/", {'email': email},
            function(response) {
                if (response.success == "True") {
                    alert('Subscribed with email: ' + email);
                }
            }, "json");

        // Close the modal
        $('#domainChangeModal').modal('hide');
    });
});
</script>
