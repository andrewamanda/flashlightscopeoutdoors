<script src="https://js.stripe.com/v3/" defer></script>
<br><br>
<fieldset class="checkout">
	{% if 'mobile' in template_name %}

  {% else %}
	<legend>Pay With Credit Card</legend>
	{% endif %}

										<center>
											<img src="/static/images/siteImg/stripe_credit-card-logos.png" style="width: 30%" alt="Checkout Through Stripe Credit Card" />
											<img class="secure-badge" src="/static/images/siteImg/secure_badge.svg" alt="Secure Payments: AES-256 Encryption">

										</center><br>
	    <div class="card mx-5">
	      <div class="card-body">
	        <div class="sr-root">
	          <div class="sr-main">
	            <form id="payment-form" class="sr-payment-form payment-view">
	              {% csrf_token %}


            <div class="sr-combo-inputs">
	                <div class="sr-combo-inputs-row">
	                  <div class="sr-input sr-card-element" id="card-element"></div>
	                </div>
						</div>
	                <div class="sr-field-error" id="card-errors" role="alert"></div>
	                <button id="submit" class="btn">
	                  <div class="spinner-border  spinner-border-sm text-light hidden" id="spinner" role="status">
	                    <span class="sr-only">Loading...</span>
	                  </div>
	                  <span id="button-text">Pay</span><span id="order-amount"> ${{ total_amt_due }}</span>
	                </button>

	            </form>
	            <div class="sr-result hidden">
	              <p>Payment completed<br></p>
	              <pre>
	                <code></code>
	              </pre>
	            </div>
	          </div>
	        </div>
	      </div>
	    </div>

	    <form id="payload" class="hidden" action="{% url 'payment-complete' %}" method="post">
	      {% csrf_token %}
	      <input id ="data-payload" type="hidden" name="payload"/>
	    </form>

	  </div>
</fieldset>
