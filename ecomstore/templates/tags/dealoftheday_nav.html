{% load catalog_tags %}

<div class="block testimonials_sidebar">
	<div class="block-title">
	<strong><span>Today's Deal</span></strong>
	</div>
	<div class="block-content">
		{% for t in active_deals %}		

			<div class="testimonial_sidebar_box">
				<div class="testimonial_sidebar_text"><a href="{{ t.get_absolute_url }}"><img src="{% thumbnail_image_url t.image.url %}" width="200px" loading="lazy" decoding="async" /></a></div>
                                <div class="testimonial_sidebar_name">{{ t.name }}</div>
                                <div class="testimonial_sidebar_name"><del>Regular Price: ${{ t.price }}</del></div>
                                <div class="testimonial_sidebar_name">Today's Price: ${{ t.sale_price }}</div>
			</div>
		{% endfor %}

    </div>
</div>
