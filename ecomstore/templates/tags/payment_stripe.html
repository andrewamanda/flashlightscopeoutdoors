</script>
		<script type="text/javascript">
				$(document).ready(function() {                                  // When the document loads,
					exampleName = "example1";
					var formClass = '.' + exampleName;
					var example = document.querySelector(formClass);

					var form = example.querySelector('form');
					var resetButton = example.querySelector('a.reset');
					var error = form.querySelector('.error');
					var errorMessage = error.querySelector('.message');
					var elements = [];
					var additionalData;

 					document.getElementById("submit").setAttribute("disabled","disabled");

						$('[name=amount]').blur(function(){                        // Set on blur
							console.log("Amount = ", $(this).val());

							document.getElementById("example1-fee").value = (Number($(this).val()) * 0.033).toFixed(2);
							document.getElementById("example1-fee").disabled = true;
							var total_amount = Number($(this).val()) * 1.033;
              var pennies = total_amount * 100;
              total_amount = Math.round(pennies)/100;
							document.getElementById("order-amount").textContent = "$" + total_amount.toFixed(2);
							var orderData = {
								items: [{ id: "products" }],
								total: Math.round(Number($(this).val()) * 103.3),
								currency: "usd",
							};
							fetch("/checkout/create-payment-intent", {
								method: "POST",
								headers: {
									"Content-Type": "application/json",
								},
								body: JSON.stringify(orderData)
							})
								.then(function(result) {
									//console.log("result json = ", result.json());
									return result.json();
								})
								.then(function(data) {
									return setupElements(data);
								})
								.then(function({ stripe, card, receipt_email, clientSecret }) {
									//document.getElementById("submitStripe").disabled = False;
									document.getElementById("submit").removeAttribute("disabled");
									// Handle form submission.
									var form = document.getElementById("payment-form");

									form.addEventListener("submit", function(event) {
										event.preventDefault();
										// Initiate payment when the submit button is clicked

										// Trigger HTML5 validation UI on the form if any of the inputs fail
										// validation.

										var plainInputsValid = true;
										Array.prototype.forEach.call(form.querySelectorAll('input'), function(
											input
										) {
											if (input.checkValidity && !input.checkValidity()) {
												plainInputsValid = false;
												return;
											}
										});
										if (!plainInputsValid) {
											triggerBrowserValidation();
											return;
										}

										// Show a loading screen...
										example.classList.add('submitting');

										// Disable all inputs.
										disableInputs();

										// Gather additional customer data we may have collected in our form.
										var name = form.querySelector('#' + exampleName + '-name');
										var address1 = form.querySelector('#' + exampleName + '-address');
										var invoice = form.querySelector('#' + exampleName + '-invoice');
										var reason = form.querySelector('#' + exampleName + '-reason');
										var city = form.querySelector('#' + exampleName + '-city');
										var state = form.querySelector('#' + exampleName + '-email');
										var zip = form.querySelector('#' + exampleName + '-zip');
										var address = "Invoice: " + invoice + " Payment Reason: " + reason + " Email: " + state;
										additionalData = {
											name: name ? name.value : undefined,
											//invoice_number: invoice ? invoice.value: undefined,
											//payment_reason: reason ? reason.value: undefine,
											//address_line1: reason ? reason.value: undefine,
											//address_city: invoice ? invoice.value: undefined,
											//address_state: state ? state.value : undefined,
											//address_zip: zip ? zip.value : undefined,
											address: address,
										};

										pay(stripe, card, receipt_email, clientSecret);
									});

									resetButton.addEventListener('click', function(e) {
										e.preventDefault();
										// Resetting the form (instead of setting the value to `''` for each input)
										// helps us clear webkit autofill styles.
										form.reset();

										// Clear each Element.
										elements.forEach(function(element) {
											element.clear();
										});

										// Reset error state as well.
										error.classList.remove('visible');

										// Resetting the form does not un-disable inputs, so we need to do it separately:
										enableInputs();
										example.classList.remove('submitted');
									});
								});



																  function enableInputs() {
																    Array.prototype.forEach.call(
																      form.querySelectorAll(
																        "input[type='text'], input[type='email'], input[type='tel']"
																      ),
																      function(input) {
																        input.removeAttribute('disabled');
																      }
																    );
																  }

																  function disableInputs() {
																    Array.prototype.forEach.call(
																      form.querySelectorAll(
																        "input[type='text'], input[type='email'], input[type='tel']"
																      ),
																      function(input) {
																        input.setAttribute('disabled', 'true');
																      }
																    );
																  }

																  function triggerBrowserValidation() {
																    // The only way to trigger HTML5 form validation UI is to fake a user submit
																    // event.
																    var submit = document.createElement('input');
																    submit.type = 'submit';
																    submit.style.display = 'none';
																    form.appendChild(submit);
																    submit.click();
																    submit.remove();
																  }

								// Set up Stripe.js and Elements to use in checkout form
								var setupElements = function(data) {
									stripe = Stripe(data.publishableKey);
									var s_elements = stripe.elements();
									var style = {
										base: {
											color: "#32325d",
											fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
											fontSmoothing: "antialiased",
											fontSize: "16px",
											"::placeholder": {
												color: "#aab7c4"
											}
										},
										invalid: {
											color: "#fa755a",
											iconColor: "#fa755a"
										}
									};
									var card = s_elements.create("card", { style: style});
									card.mount("#example1-card");


								  // Listen for errors from each Element, and show error messages in the UI.
								  var savedErrors = {};

									elements[0] = card;
								  elements.forEach(function(element, idx) {
								    element.on('change', function(event) {
								      if (event.error) {
								        error.classList.add('visible');
								        savedErrors[idx] = event.error.message;
								        errorMessage.innerText = event.error.message;
								      } else {
								        savedErrors[idx] = null;

								        // Loop over the saved errors and find the first one, if any.
								        var nextError = Object.keys(savedErrors)
								          .sort()
								          .reduce(function(maybeFoundError, key) {
								            return maybeFoundError || savedErrors[key];
								          }, null);

								        if (nextError) {
								          // Now that they've fixed the current error, show another one.
								          errorMessage.innerText = nextError;
								        } else {
								          // The user fixed the last error; no more errors.
								          error.classList.remove('visible');
								        }
								      }
								    });
								  });


									return {
										stripe: stripe,
										card: card,
                    receipt_email: data.receipt_email,
										clientSecret: data.clientSecret
									};
								};
								/*
							 	* Calls stripe.confirmCardPayment which creates a pop-up modal to
							 	* prompt the user to enter extra authentication details without leaving your page
							 	*/
							  var pay = function(stripe, card, receipt_email, clientSecret) {
							 	 //changeLoadingState(true);
							 	 // Initiate the payment.
							 	 // If authentication is required, confirmCardPayment will automatically display a modal

								 							      example.classList.remove('submitting');

							 	 stripe
							 		 .confirmCardPayment(clientSecret, {
                     receipt_email: receipt_email,
							 			 payment_method: {
							 				 card: card,
											 billing_details: additionalData,
							 			 }
							 		 })
							 		 .then(function(result) {
							 			 if (result.error) {
							 				 	 console.log("Pay error: ", result.error.message);
												 enableInputs();

							 				 // Show error to your customer
							 				 showError(result.error.message);
							 			 } else {
							 				 // The payment has been processed!
							 				 	 console.log("Pay no error, result = ", result);
												 example.querySelector('.token').innerText = result.paymentIntent['id'];
												 example.classList.add('submitted');
							 				 //orderComplete(clientSecret);
							 			 }
							 		 });
							  };

								function submitForm(form) {
								    const submitFormFunction = Object.getPrototypeOf(form).submit;
								    submitFormFunction.call(form);
								}

								var orderComplete = function(clientSecret) {
									var form2 =document.getElementById("payment-form");
									form2.action = "/checkout/makeapaymentcomplete/";

						 		 if (form2) {
						 			 console.log("Form2 submit");
						 		 		submitForm(form2);

						 	 		}
							  };
                var showError = function(errorMsgText) {
                  if (confirm(errorMsgText)) {
                    location.reload();
                  }
                  else {
                    location.reload();
                  }
                };




						});

				});
		</script>
