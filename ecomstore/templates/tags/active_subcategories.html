{% load cache %}

			<ul>
				{% for s in active_subcategories %}

					<li >

						{% if s.display_name %}
						<a  href="{{ s.get_absolute_url }}">{{ s.display_name }} </a>
						{% else %}
						<a  href="{{ s.get_absolute_url }}">{{ s.name }} </a>

						{% endif %}
					</li>

				{% endfor %}
			</ul>
