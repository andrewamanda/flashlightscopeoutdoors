{% load catalog_tags %}

{% for d in active_departments %}
<div class="block">
<div class="block-title yuinavfont"><strong><span>{{ d.name }}</span></strong>
</div>
<div class="block-content">
<br />
                <div>
                        <a href="{{ d.get_absolute_url }}">
                                <img src="{% if d.image %}{% large_image_url d.image.url %}{% endif %}" alt="{{ d.name }}" height="225px" />

                        </a>
                </div>

<div class="cb"><br /></div>
</div>
</div>

<br>
{% endfor %}
