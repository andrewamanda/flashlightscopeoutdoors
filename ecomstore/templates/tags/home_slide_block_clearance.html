{% load catalog_tags %}

{% if clearance|length > 0 %}
<div class="block">
<div class="block-title yuinavfont"><strong><span>Clearance Corner</span></strong>
	<div style="float:right;padding-top:5px;"> <a href="{% url 'clearance' %}"><img src="/static/images/siteImg/viewall_button.gif" /></a></div>
</div>
<div class="block-content">
<br />
	<div class="MagicScroll" id="productsonclearance">
		{% for p in clearance %}
		<div>
			<a target="_blank" href="{{ p.get_absolute_url }}">
				<span style="font-family:Georgia; line-height:18px; font-size: 12px;color:red;">Sale Price: ${{ p.sale_price }}</span>
				<img src="{% thumbnail_image_url p.image.url %}" height="105px" loading="lazy" decoding="async" />
				<span style="font-family:Georgia; line-height:18px; font-size: 12px;">{{ p.name }} <br>Regular Price: ${{ p.demo_price }}</span><br />

			</a>
		</div>
		{% endfor %}

	</div>
<div class="cb"><br /></div>
</div>
</div>

{% endif %}
