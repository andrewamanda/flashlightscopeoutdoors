{% load catalog_tags %}

{% if request.META.HTTP_HOST !=  DISTRIBUTOR_SITE_DOMAIN %}
<div class="block">
<div class="block-title yuinavfont"><strong><span>Featured Products</span></strong></div>
<div class="block-content">
<br />
	<div class="MagicScroll" id="featuredproducts">
		{% for p in featured %}
		<div>
			<a href="{{ p.get_absolute_url }}" style="font-family:Georgia; line-height:18px; font-size: 12px;">{{ p.name }}</a><br />
			{% if p.image %}
				<a class="MagicZoomPlus" href="{% large_image_url p.image.url %}" rel="zoom-position: inner;hint-position: br;hint-text:;">
			{% endif %}
			<img src="{% thumbnail_image_url p.image.url %}" loading="lazy" decoding="async" />
			{% if p.image %}
				</a>
			{% endif %}<br />
			<a href="{{ p.get_absolute_url }}" style="font-family:Georgia; line-height:18px; font-size: 12px;"><b>Price: ${{ p.price }}</b></a>
		</div>
		{% endfor %}

	</div>
<div class="cb"><br /></div>
</div>
</div>

{% else %}
<br />
{% slide_list_all_in_brand request %}


{% endif %}
