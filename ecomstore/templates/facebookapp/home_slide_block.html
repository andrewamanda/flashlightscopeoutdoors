{% load catalog_tags %}

<div class="block">
<div class="block-title yuinavfont"><strong><span>Featured Products</span></strong></div>
<div class="block-content">
<br />
	<div class="MagicScroll" id="featuredproducts">
		{% for p in featured %}
		<div>
			<a target="_blank" href="{{ p.get_absolute_url }}" style="font-family:Georgia; line-height:18px; font-size: 12px;">{{ p.name }}</a><br />
			{% if p.image %}
				<a class="MagicZoomPlus" href="{{p.image.super.url}}" rel="zoom-position: inner;hint-position: br;hint-text:;">
			{% endif %}
			<img src="{{ p.image.thumbnail.url }}" />
			{% if p.image %}
				</a>
			{% endif %}<br />
			<a target="_blank" href="{{ p.get_absolute_url }}" style="font-family:Georgia; line-height:18px; font-size: 12px;"><b>Price: ${{ p.price }}</b></a>
		</div>
		{% endfor %}

	</div>
<div class="cb"><br /></div>
</div>
</div>
